<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">&#128274;</div>
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="login">Username or Email</label>
          <input type="text" id="login" name="login" placeholder="Enter username or email" required>
          <span class="error-msg">Please enter your username or email</span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
          <span class="input-icon toggle-password" onclick="togglePassword()">&#128065;</span>
          <span class="error-msg">Please enter your password</span>
        </div>

        <a href="#" class="forgot-link">Forgot password?</a>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span class="btn-text">Sign In</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Sign Up</a>
      </div>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">&#128100;</div>
        <h1>Create Account</h1>
        <p>Register to get started</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" placeholder="John" required>
            <span class="error-msg">First name is required</span>
          </div>
          <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" placeholder="Doe" required>
            <span class="error-msg">Last name is required</span>
          </div>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="johndoe" required>
          <span class="error-msg">Username is required</span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="john@example.com" required>
          <span class="error-msg">Valid email is required</span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 234 567 890">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Min. 6 characters" required>
          <span class="input-icon toggle-password" onclick="togglePassword('password')">&#128065;</span>
          <span class="error-msg">Password must be at least 6 characters</span>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
          <span class="input-icon toggle-password" onclick="togglePassword('confirm_password')">&#128065;</span>
          <span class="error-msg">Passwords do not match</span>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span class="btn-text">Create Account</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/register.js"></script>
</body>
</html>
